<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Illustration of digital coins and a credits balance on a statement card">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0c111a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="20" fill="url(#bg2)"/>
  <!-- statement card -->
  <rect x="250" y="70" width="330" height="280" rx="18" fill="#182230" stroke="#334155" stroke-width="2"/>
  <rect x="278" y="100" width="170" height="18" rx="9" fill="#3b4a63"/>
  <rect x="278" y="138" width="120" height="12" rx="6" fill="#2a3a52"/>
  <line x1="278" y1="172" x2="552" y2="172" stroke="#2a3a52" stroke-width="2" stroke-dasharray="6 8"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="278" y="205" fill="#9fb4cd" font-size="15">Promotional credit</text>
    <text x="552" y="205" fill="#e6edf6" font-size="15" text-anchor="end">verified in account</text>
    <text x="278" y="240" fill="#9fb4cd" font-size="15">Referral reward</text>
    <text x="552" y="240" fill="#9fb4cd" font-size="15" text-anchor="end">see official terms</text>
    <text x="278" y="275" fill="#9fb4cd" font-size="15">Third-party offer</text>
    <text x="552" y="275" fill="#fbbf24" font-size="15" text-anchor="end">check carefully</text>
    <text x="278" y="310" fill="#9fb4cd" font-size="15">Token generator</text>
    <text x="552" y="310" fill="#f87171" font-size="15" text-anchor="end">unsafe</text>
  </g>
  <!-- coin stack -->
  <g>
    <ellipse cx="150" cy="330" rx="86" ry="30" fill="#0d1420" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
    <ellipse cx="150" cy="292" rx="86" ry="30" fill="#182230" stroke="#fbbf24" stroke-width="3"/>
    <path d="M64 292 v38 c0 17 39 30 86 30 s86-13 86-30 v-38" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <ellipse cx="150" cy="254" rx="86" ry="30" fill="#1b2738" stroke="#fbbf24" stroke-width="3"/>
    <path d="M64 254 v38 c0 17 39 30 86 30 s86-13 86-30 v-38" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <ellipse cx="150" cy="216" rx="86" ry="30" fill="#1e2c40" stroke="#fbbf24" stroke-width="3"/>
    <path d="M150 200 v32 M137 212 h22 a10 10 0 0 1 0 20 h-24" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
