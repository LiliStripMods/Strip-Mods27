<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Illustration of a shield with a check mark protecting a login card and digital coins">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0c111a"/>
    </linearGradient>
    <linearGradient id="shield1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a3d"/>
      <stop offset="1" stop-color="#13202f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="20" fill="url(#bg1)"/>
  <g opacity="0.16" stroke="#7c93b0" stroke-width="1.5">
    <path d="M0 70 H640 M0 140 H640 M0 210 H640 M0 280 H640 M0 350 H640"/>
    <path d="M80 0 V420 M160 0 V420 M240 0 V420 M320 0 V420 M400 0 V420 M480 0 V420 M560 0 V420"/>
  </g>
  <!-- central shield -->
  <path d="M320 70 L438 112 V214 C438 292 388 342 320 376 C252 342 202 292 202 214 V112 Z" fill="url(#shield1)" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
  <path d="M278 222 L308 252 L368 182" fill="none" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- login card -->
  <g transform="translate(70 238)">
    <rect width="180" height="118" rx="14" fill="#182230" stroke="#334155" stroke-width="2"/>
    <rect x="22" y="26" width="136" height="16" rx="8" fill="#334155"/>
    <rect x="22" y="56" width="96" height="14" rx="7" fill="#26344a"/>
    <rect x="22" y="82" width="60" height="22" rx="11" fill="#818cf8"/>
  </g>
  <!-- coins -->
  <g>
    <ellipse cx="500" cy="330" rx="52" ry="20" fill="#0d1420" stroke="#fbbf24" stroke-width="3" opacity="0.55"/>
    <ellipse cx="500" cy="300" rx="52" ry="20" fill="#182230" stroke="#fbbf24" stroke-width="3"/>
    <path d="M462 300 V320 C462 331 479 340 500 340 C521 340 538 331 538 320 V300" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M500 290 v20 M492 296 h14 a6 6 0 0 1 0 12 h-16" fill="none" stroke="#fbbf24" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="524" cy="262" rx="34" ry="13" fill="#182230" stroke="#f59e0b" stroke-width="2.6"/>
    <path d="M497 262 v13 c0 7 12 13 27 13 s27-6 27-13 v-13" fill="none" stroke="#f59e0b" stroke-width="2.6"/>
  </g>
  <!-- small lock on shield top -->
  <g transform="translate(304 116)">
    <rect x="0" y="16" width="32" height="26" rx="5" fill="#0f1521" stroke="#818cf8" stroke-width="3"/>
    <path d="M7 16 V9 a9 9 0 0 1 18 0 v7" fill="none" stroke="#818cf8" stroke-width="3"/>
  </g>
</svg>
