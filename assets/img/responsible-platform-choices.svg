<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Illustration of a person choosing between a verified path and a risky shortcut, with a shield overhead">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#0c111a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="20" fill="url(#bg5)"/>
  <!-- signpost -->
  <line x1="210" y1="350" x2="210" y2="120" stroke="#7c93b0" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(118 120)">
    <rect width="230" height="52" rx="10" fill="#134e3f" stroke="#2dd4bf" stroke-width="2.5"/>
    <path d="M230 0 l22 26 l-22 26 Z" fill="#134e3f" stroke="#2dd4bf" stroke-width="2.5"/>
    <circle cx="26" cy="26" r="11" fill="#2dd4bf"/>
    <path d="M21 26 l4 4 l8 -9" fill="none" stroke="#0c111a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="32" fill="#d8fdf6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Official, documented offers</text>
  </g>
  <g transform="translate(96 190)">
    <rect width="190" height="52" rx="10" fill="#3a2320" stroke="#f87171" stroke-width="2.5"/>
    <path d="M0 0 l-22 26 l22 26 Z" fill="#3a2320" stroke="#f87171" stroke-width="2.5"/>
    <path d="M30 14 v24 M22 22 h16 M22 32 h12" stroke="#f87171" stroke-width="2.8" stroke-linecap="round"/>
    <text x="50" y="32" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Generators &amp; hacks</text>
  </g>
  <!-- person -->
  <g transform="translate(360 150)">
    <circle cx="40" cy="26" r="20" fill="#818cf8"/>
    <path d="M8 120 C8 76 72 76 72 120 L72 168 C72 182 58 190 40 190 C22 190 8 182 8 168 Z" fill="#1e2c40" stroke="#818cf8" stroke-width="3"/>
    <path d="M8 104 l-26 30 M72 104 l30 -12" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
    <!-- legs -->
    <path d="M26 188 l-8 42 M54 188 l10 42" stroke="#818cf8" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- shield overhead -->
  <g transform="translate(368 60) scale(0.55)">
    <path d="M40 0 L92 18 V70 C92 108 68 134 40 148 C12 134 -12 108 -12 70 V18 Z" fill="#16202f" stroke="#2dd4bf" stroke-width="5" stroke-linejoin="round" transform="translate(12 0)"/>
  </g>
  <!-- path -->
  <path d="M330 392 C330 350 280 330 230 300" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 16"/>
</svg>
